<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Marine Life Ocean Zones</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Comic Sans MS", Arial, sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #bdf5ff;
}

#app {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* SLIDE 1 */
#logoSlide {
  width: 100%;
  height: 100%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

#logoSlide img {
  width: min(55vw, 300px);
  height: auto;
}

/* GAME SLIDE */
#gameSlide {
  display: none;
  width: 100%;
  height: 100%;
  background: linear-gradient(#bdf5ff, #eaffff);
  padding: 1vh 1.2vw;
}

.header {
  height: 8vh;
  text-align: center;
  font-size: clamp(19px, 3.2vw, 38px);
  color: #035283;
  font-weight: bold;
  letter-spacing: 1px;
  text-shadow: 1px 2px 0 #ffffff;
}

.main {
  display: flex;
  width: 100%;
  height: 84vh;
  gap: 1.3vw;
}

.animalsPanel {
  width: 50%;
  background: rgba(255,255,255,0.9);
  border-radius: 24px;
  padding: 1vh;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1vh;
  border: 4px solid #55cfff;
}

.animal {
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f1fdff 45%, #bdefff 100%);
  border-radius: 50%;
  border: 3px solid #7bdcff;
  box-shadow:
    inset -8px -8px 15px rgba(0, 130, 180, 0.18),
    inset 7px 7px 13px rgba(255, 255, 255, 0.95),
    0 5px 12px rgba(0, 90, 140, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  touch-action: none;
  user-select: none;
  aspect-ratio: 1 / 1;
  min-height: 0;
  position: relative;
}

.animal::after {
  content: "";
  position: absolute;
  top: 13%;
  left: 18%;
  width: 22%;
  height: 14%;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  transform: rotate(-25deg);
}

.animal img {
  max-width: 82%;
  max-height: 82%;
  object-fit: contain;
  pointer-events: none;
  z-index: 2;
}

.animal.used {
  opacity: 0.35;
}

.zonesPanel {
  width: 50%;
  border-radius: 24px;
  overflow: hidden;
  border: 4px solid #07518a;
  position: relative;
  box-shadow: 0 8px 18px rgba(0, 50, 90, 0.3);
}

.zone {
  height: 33.33%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: clamp(17px, 2.8vw, 32px);
  font-weight: bold;
  text-shadow: 2px 3px 4px #001b3d;
  position: relative;
}

.zone span {
  background: rgba(0,0,0,0.22);
  padding: 8px 16px;
  border-radius: 16px;
  z-index: 5;
}

.sunlight {
  background: linear-gradient(#36c7ed, #1891d2);
}

.twilight {
  background: linear-gradient(#1268ad, #073f83);
}

.midnight {
  background: linear-gradient(#032c65, #011438);
}

.zone.highlight {
  outline: 5px solid #fff176;
  outline-offset: -8px;
}

.footer {
  height: 8vh;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 1vw;
}

button {
  border: none;
  border-radius: 18px;
  padding: 8px 20px;
  font-size: clamp(14px, 2.4vw, 22px);
  font-weight: bold;
  background: #ffd44d;
  color: #00456d;
  box-shadow: 0 5px 0 #d99d00;
  cursor: pointer;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #d99d00;
}

#message {
  font-size: clamp(14px, 2.3vw, 23px);
  color: #064c73;
  font-weight: bold;
  text-align: center;
}

/* END SLIDE */
#endSlide {
  display: none;
  width: 100%;
  height: 100%;
  background: linear-gradient(#99efff, #0088d6, #00386e);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  text-align: center;
  position: relative;
  overflow: hidden;
}

#endSlide h1 {
  font-size: clamp(38px, 8vw, 80px);
  text-shadow: 3px 5px 0 #00436d;
  margin-bottom: 14px;
}

#endSlide p {
  font-size: clamp(18px, 4vw, 34px);
  margin: 12px;
  font-weight: bold;
}

.confetti {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 16px;
  animation: fall 2.8s linear forwards;
  z-index: 50;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

/* DRAG CLONE */
.dragging {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  width: 88px;
  height: 88px;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f1fdff 45%, #bdefff 100%);
  border-radius: 50%;
  border: 3px solid #ffd44d;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.dragging img {
  max-width: 82%;
  max-height: 82%;
}

/* SMALL SCREENS */
@media (max-width: 700px) {
  .header {
    height: 7vh;
  }

  .main {
    height: 85vh;
    gap: 1vw;
  }

  .animalsPanel {
    grid-template-columns: repeat(2, 1fr);
    border-radius: 18px;
    padding: 0.7vh;
    gap: 0.7vh;
  }

  .zonesPanel {
    border-radius: 18px;
  }

  .footer {
    height: 8vh;
  }

  button {
    padding: 7px 12px;
  }
}
</style>
</head>

<body>
<div id="app">

  <!-- Slide 1 -->
  <div id="logoSlide">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
  </div>

  <!-- Slide 2 -->
  <div id="gameSlide">
    <div class="header">Drag the Marine Animals to Their Ocean Zones</div>

    <div class="main">
      <div class="animalsPanel" id="animalsPanel"></div>

      <div class="zonesPanel">
        <div class="zone sunlight" data-zone="sunlight"><span>Sunlight Zone</span></div>
        <div class="zone twilight" data-zone="twilight"><span>Twilight Zone</span></div>
        <div class="zone midnight" data-zone="midnight"><span>Midnight Zone</span></div>
      </div>
    </div>

    <div class="footer">
      <button onclick="resetGame()">Clear</button>
      <div id="message">Drag each animal to the correct ocean zone.</div>
      <button onclick="checkGame()">Check</button>
    </div>
  </div>

  <!-- Slide 3 -->
  <div id="endSlide">
    <h1>Great Job!</h1>
    <p>You placed all marine animals correctly!</p>
    <button onclick="resetGame()">Play Again</button>
  </div>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const animals = [
  { name: "anglerfish", img: "anglerfish.png", zone: "midnight" },
  { name: "clownfish", img: "clownfish.png", zone: "sunlight" },
  { name: "dolphin", img: "dolphin.png", zone: "sunlight" },
  { name: "eel", img: "eel.png", zone: "midnight" },
  { name: "jellyfish", img: "jellyfish.png", zone: "twilight" },
  { name: "octopus", img: "octopus.png", zone: "twilight" },
  { name: "sea turtle", img: "sea-turtle.png", zone: "sunlight" },
  { name: "shrimp", img: "shrimp.png", zone: "twilight" },
  { name: "squid", img: "squid.png", zone: "twilight" },
  { name: "starfish", img: "starfish.png", zone: "sunlight" }
];

let placements = {};
let attempts = 0;
let dragItem = null;
let dragClone = null;

setTimeout(() => {
  document.getElementById("logoSlide").style.display = "none";
  document.getElementById("gameSlide").style.display = "block";
  loadAnimals();
}, 2000);

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function loadAnimals() {
  const panel = document.getElementById("animalsPanel");
  panel.innerHTML = "";
  placements = {};
  attempts = 0;
  document.getElementById("message").textContent = "Drag each animal to the correct ocean zone.";
  document.querySelectorAll(".zone img").forEach(img => img.remove());

  shuffle([...animals]).forEach(animal => {
    const div = document.createElement("div");
    div.className = "animal";
    div.dataset.name = animal.name;
    div.dataset.zone = animal.zone;
    div.innerHTML = `<img src="assets/${animal.img}" alt="${animal.name}">`;
    div.addEventListener("pointerdown", startDrag);
    panel.appendChild(div);
  });
}

function startDrag(e) {
  dragItem = e.currentTarget;

  dragClone = dragItem.cloneNode(true);
  dragClone.className = "dragging";
  document.body.appendChild(dragClone);

  moveClone(e.clientX, e.clientY);

  document.addEventListener("pointermove", dragMove);
  document.addEventListener("pointerup", endDrag);
}

function dragMove(e) {
  moveClone(e.clientX, e.clientY);

  document.querySelectorAll(".zone").forEach(z => z.classList.remove("highlight"));

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const zone = target && target.closest(".zone");

  if (zone) zone.classList.add("highlight");
}

function moveClone(x, y) {
  if (!dragClone) return;
  dragClone.style.left = x - 44 + "px";
  dragClone.style.top = y - 44 + "px";
}

function endDrag(e) {
  document.querySelectorAll(".zone").forEach(z => z.classList.remove("highlight"));

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const zone = target && target.closest(".zone");

  if (zone && dragItem) {
    const selectedZone = zone.dataset.zone;
    placements[dragItem.dataset.name] = selectedZone;

    removeOldPlacedImage(dragItem.dataset.name);

    const placedImg = dragItem.querySelector("img").cloneNode(true);
    placedImg.style.position = "absolute";
    placedImg.style.width = "15%";
    placedImg.style.maxHeight = "28%";
    placedImg.style.objectFit = "contain";
    placedImg.style.left = Math.random() * 68 + 10 + "%";
    placedImg.style.top = Math.random() * 45 + 28 + "%";
    placedImg.dataset.name = dragItem.dataset.name;

    zone.appendChild(placedImg);
    dragItem.classList.add("used");
  }

  if (dragClone) dragClone.remove();
  dragClone = null;
  dragItem = null;

  document.removeEventListener("pointermove", dragMove);
  document.removeEventListener("pointerup", endDrag);
}

function removeOldPlacedImage(name) {
  document.querySelectorAll(".zone img").forEach(img => {
    if (img.dataset.name === name) img.remove();
  });
}

function checkGame() {
  let correct = 0;

  animals.forEach(animal => {
    if (placements[animal.name] === animal.zone) {
      correct++;
    }
  });

  if (correct === animals.length) {
    playSound("correctSound");
    playSound("clapSound");
    showEndSlide();
  } else {
    attempts++;
    playSound("wrongSound");

    if (navigator.vibrate) {
      navigator.vibrate(150);
    }

    if (attempts < 2) {
      document.getElementById("message").textContent =
        "Try again! Some animals are in the wrong zone.";
    } else {
      document.getElementById("message").textContent =
        "Try again carefully. Check each ocean zone!";
    }
  }
}

function showEndSlide() {
  document.getElementById("gameSlide").style.display = "none";
  document.getElementById("endSlide").style.display = "flex";
  makeConfetti();
}

function makeConfetti() {
  const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#ffffff", "#ff9f1c"];

  for (let i = 0; i < 90; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 1.2 + "s";
    piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    document.body.appendChild(piece);

    setTimeout(() => {
      piece.remove();
    }, 4200);
  }
}

function playSound(id) {
  const sound = document.getElementById(id);
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

function resetGame() {
  document.getElementById("endSlide").style.display = "none";
  document.getElementById("gameSlide").style.display = "block";
  loadAnimals();
}
</script>
</body>
</html>
