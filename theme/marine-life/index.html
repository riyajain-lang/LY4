<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marine Life Ocean Zones</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Comic Sans MS",Arial,sans-serif;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#c9f7ff}
#app{width:100vw;height:100vh;overflow:hidden}

#logoSlide{
  width:100%;height:100%;background:#fff;
  display:flex;align-items:center;justify-content:center;
}
#logoSlide img{width:min(55vw,300px)}

#gameSlide{
  display:none;width:100%;height:100%;
  background:#c9f7ff;padding:.5vh 1vw;
}

.header{
  height:6vh;text-align:center;font-weight:bold;
  font-size:clamp(16px,3vw,32px);
  color:#004f83;text-shadow:1px 2px #fff;
}

.main{
  height:88vh;
  display:flex;
  gap:1.2vw;
}

.animalsPanel{
  width:50%;height:100%;
  background:rgba(255,255,255,.96);
  border:3px solid #55cfff;
  border-radius:16px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:.5vh .7vw;
  padding:.6vh .8vw;
  overflow:hidden;
}

.animal{
  width:100%;height:100%;
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
  cursor:grab;
}

.bubble{
  width:min(82%,145px);
  height:min(82%,82px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff,#ecffff,#c9f7ff);
  border:2px solid #7bdcff;
  box-shadow:0 3px 8px rgba(0,80,120,.2), inset -4px -4px 9px rgba(0,120,160,.14);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}

.animal img{
  max-width:78%;
  max-height:78%;
  object-fit:contain;
  pointer-events:none;
}

.animal.done{opacity:.25;pointer-events:none}

.zonesPanel{
  width:50%;height:100%;
  border:3px solid #07518a;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 12px rgba(0,50,90,.25);
}

.zone{
  height:33.333%;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:bold;
  font-size:clamp(15px,2.4vw,28px);
  text-shadow:2px 3px 4px #001;
}

.zone span{
  background:rgba(0,0,0,.25);
  padding:7px 14px;
  border-radius:12px;
  z-index:3;
}

.sunlight{background:linear-gradient(#37c7ee,#1f94d6)}
.twilight{background:linear-gradient(#1269ad,#073f83)}
.midnight{background:linear-gradient(#032c65,#011438)}
.zone.hover{outline:5px solid #fff176;outline-offset:-7px}

.placedAnimal{
  position:absolute;
  width:50px;height:50px;
  object-fit:contain;
  z-index:5;
  pointer-events:none;
}

.footer{
  height:5.5vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

button{
  background:#ffd447;
  color:#00456d;
  border:none;
  border-radius:14px;
  padding:6px 14px;
  font-weight:bold;
  box-shadow:0 3px #d99d00;
  cursor:pointer;
}

#message{
  font-size:clamp(12px,1.8vw,18px);
  color:#004f83;
  font-weight:bold;
  text-align:center;
}

.dragging{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  width:70px;height:70px;
  border-radius:50%;
  background:#fff;
  border:3px solid #ffd447;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 12px rgba(0,0,0,.25);
}

.dragging img{max-width:82%;max-height:82%;object-fit:contain}

#endSlide{
  display:none;
  width:100%;height:100%;
  background:linear-gradient(#9ff1ff,#008bd7,#00386e);
  color:white;text-align:center;
  align-items:center;justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

#endSlide h1{
  font-size:clamp(40px,8vw,80px);
  text-shadow:3px 5px #00436d;
}

#endSlide p{
  font-size:clamp(18px,4vw,34px);
  margin:14px;
  font-weight:bold;
}

.confetti{
  position:fixed;
  top:-20px;
  width:10px;height:16px;
  animation:fall 3s linear forwards;
  z-index:99;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}

@media(max-width:700px){
  .main{height:88.5vh}
  .header{height:6vh;font-size:17px}
  .footer{height:5.5vh}
  .bubble{width:82%;height:78%}
  .placedAnimal{width:38px;height:38px}
}
</style>
</head>

<body>
<div id="app">

  <div id="logoSlide">
    <img src="assets/innovine-logo.png" alt="Logo">
  </div>

  <div id="gameSlide">
    <div class="header">Drag the Marine Animals to Their Ocean Zones</div>

    <div class="main">
      <div class="animalsPanel" id="animalsPanel"></div>

      <div class="zonesPanel">
        <div class="zone sunlight" data-zone="sunlight"><span>Sunlight Zone</span></div>
        <div class="zone twilight" data-zone="twilight"><span>Twilight Zone</span></div>
        <div class="zone midnight" data-zone="midnight"><span>Midnight Zone</span></div>
      </div>
    </div>

    <div class="footer">
      <button onclick="resetGame()">Clear</button>
      <div id="message">Drag each animal to the correct ocean zone.</div>
      <button onclick="checkGame()">Check</button>
    </div>
  </div>

  <div id="endSlide">
    <h1>Great Job!</h1>
    <p>You placed all marine animals correctly!</p>
    <button onclick="resetGame()">Play Again</button>
  </div>

</div>

<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<script>
const animals=[
  {name:"anglerfish",img:"anglerfish.png",zone:"midnight"},
  {name:"clownfish",img:"clownfish.png",zone:"sunlight"},
  {name:"dolphin",img:"dolphin.png",zone:"sunlight"},
  {name:"eel",img:"eel.png",zone:"midnight"},
  {name:"jellyfish",img:"jellyfish.png",zone:"twilight"},
  {name:"octopus",img:"octopus.png",zone:"twilight"},
  {name:"sea turtle",img:"sea-turtle.png",zone:"sunlight"},
  {name:"shrimp",img:"shrimp.png",zone:"twilight"},
  {name:"squid",img:"squid.png",zone:"twilight"},
  {name:"starfish",img:"starfish.png",zone:"sunlight"}
];

let placements={},dragItem=null,dragClone=null,audioUnlocked=false;

setTimeout(()=>{
  document.getElementById("logoSlide").style.display="none";
  document.getElementById("gameSlide").style.display="block";
  loadAnimals();
},2000);

function unlockAudio(){
  if(audioUnlocked)return;
  audioUnlocked=true;
  [wrongSound,clapSound].forEach(a=>{
    a.volume=1;
    a.play().then(()=>{a.pause();a.currentTime=0}).catch(()=>{});
  });
}
document.addEventListener("pointerdown",unlockAudio,{once:true});

function shuffle(arr){return arr.sort(()=>Math.random()-.5)}

function loadAnimals(){
  animalsPanel.innerHTML="";
  placements={};
  document.querySelectorAll(".placedAnimal,.confetti").forEach(e=>e.remove());
  message.textContent="Drag each animal to the correct ocean zone.";

  shuffle([...animals]).forEach(a=>{
    const div=document.createElement("div");
    div.className="animal";
    div.dataset.name=a.name;
    div.dataset.zone=a.zone;
    div.innerHTML=`<div class="bubble"><img src="assets/${a.img}" alt="${a.name}"></div>`;
    div.addEventListener("pointerdown",startDrag);
    animalsPanel.appendChild(div);
  });
}

function startDrag(e){
  if(e.currentTarget.classList.contains("done"))return;
  dragItem=e.currentTarget;

  const img=dragItem.querySelector("img").cloneNode(true);
  dragClone=document.createElement("div");
  dragClone.className="dragging";
  dragClone.appendChild(img);
  document.body.appendChild(dragClone);

  moveClone(e.clientX,e.clientY);
  document.addEventListener("pointermove",dragMove);
  document.addEventListener("pointerup",endDrag);
}

function dragMove(e){
  moveClone(e.clientX,e.clientY);
  document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hover"));
  const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest(".zone");
  if(zone)zone.classList.add("hover");
}

function moveClone(x,y){
  if(!dragClone)return;
  dragClone.style.left=x-35+"px";
  dragClone.style.top=y-35+"px";
}

function endDrag(e){
  document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hover"));

  const zone=document.elementFromPoint(e.clientX,e.clientY)?.closest(".zone");

  if(zone && dragItem){
    const correctZone=dragItem.dataset.zone;
    const chosenZone=zone.dataset.zone;
    const name=dragItem.dataset.name;

    if(chosenZone===correctZone){
      placements[name]=chosenZone;
      placeAnimal(dragItem,zone);
      dragItem.classList.add("done");
      playClap();
      message.textContent="Good! Keep going.";

      if(Object.keys(placements).length===animals.length){
        setTimeout(finishGame,600);
      }
    }else{
      playWrong();
      message.textContent="Try again! This animal belongs to another zone.";
      if(navigator.vibrate)navigator.vibrate(180);
    }
  }

  if(dragClone)dragClone.remove();
  dragClone=null;
  dragItem=null;

  document.removeEventListener("pointermove",dragMove);
  document.removeEventListener("pointerup",endDrag);
}

function placeAnimal(item,zone){
  const img=item.querySelector("img").cloneNode(true);
  img.className="placedAnimal";

  const count=zone.querySelectorAll(".placedAnimal").length;
  const spots=[
    ["7%","15%"],["20%","55%"],["36%","16%"],
    ["52%","55%"],["68%","16%"],["82%","55%"]
  ];

  img.style.left=spots[count%spots.length][0];
  img.style.top=spots[count%spots.length][1];

  zone.appendChild(img);
}

function checkGame(){
  if(Object.keys(placements).length===animals.length){
    finishGame();
  }else{
    playWrong();
    message.textContent="Some animals are still left. Drag all animals first.";
  }
}

function finishGame(){
  playClap();
  gameSlide.style.display="none";
  endSlide.style.display="flex";
  makeConfetti();
}

function playWrong(){
  wrongSound.currentTime=0;
  wrongSound.play().catch(()=>{});
}

function playClap(){
  clapSound.currentTime=0;
  clapSound.play().catch(()=>{});
}

function makeConfetti(){
  const colors=["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#fff","#ff9f1c"];
  for(let i=0;i<90;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*1+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}

function resetGame(){
  endSlide.style.display="none";
  gameSlide.style.display="block";
  loadAnimals();
}
</script>
</body>
</html>
