<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solar System Jumble</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;}
body{background:#000 url('./assets/space-bg.png') no-repeat center center; background-size:cover;}

.screen{width:100vw;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;}

#logoScreen{background:white;z-index:10;}
#logoScreen img{width:230px;max-width:75%;}

#gameScreen{display:none;background:rgba(0,0,0,0.3);}

.card{
  width:92vw;height:92vh;max-width:520px;
  background:rgba(255,255,255,.86);
  border-radius:24px;border:3px solid #f4b8c9;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
  padding:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  z-index:2;
}

.topBar{
  width:100%;display:flex;justify-content:space-between;
  font-weight:bold;color:#9b4770;font-size:15px;
}

.planetImg{
  width:170px;height:135px;object-fit:contain;background:white;
  border-radius:18px;border:3px solid #ffd2df;padding:6px;
}

.spellingTitle{font-size:15px;color:#7b4b61;font-weight:bold;}

#correctWord{
  font-size:24px;font-weight:bold;color:#b44273;
  letter-spacing:2px;text-align:center;
}

#blankArea{
  width:100%;display:flex;flex-wrap:wrap;justify-content:center;
  gap:6px;min-height:82px;
}

.blank{
  width:34px;height:40px;border-bottom:4px solid #89506a;background:#fff;
  border-radius:10px 10px 4px 4px;
  display:flex;justify-content:center;align-items:center;
  font-size:23px;font-weight:bold;color:#4a3140;
}

.space{width:18px;height:40px;}

#letterArea{
  width:100%;display:flex;flex-wrap:wrap;
  justify-content:center;gap:7px;
}

.letter{
  width:38px;height:38px;border:none;border-radius:12px;
  background:#ffcae0;color:#66324d;
  font-size:21px;font-weight:bold;
  box-shadow:0 4px 0 #d98bac;cursor:pointer;
}

.letter:active{transform:translateY(3px);box-shadow:0 1px 0 #d98bac;}
.letter.used{opacity:.25;pointer-events:none;}

#message{height:25px;font-size:18px;font-weight:bold;color:#2f9b5a;}

#finalScreen{display:none;background:white;flex-direction:column;text-align:center;}
#finalScreen h1{font-size:34px;color:#e34f87;margin-bottom:15px;}
#finalScreen button{padding:14px 28px;border:none;border-radius:25px;background:#65c96f;color:white;font-size:20px;font-weight:bold;}
.confetti{position:absolute;width:10px;height:16px;top:-20px;animation:fall 3s linear infinite;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}

@media(max-width:480px){
  .card{height:95vh;padding:8px;}
  .planetImg{width:135px;height:100px;}
  #correctWord{font-size:20px;}
  .blank{width:28px;height:33px;font-size:19px;}
  .letter{width:31px;height:31px;font-size:17px;}
  #blankArea{gap:4px;min-height:70px;}
  #letterArea{gap:5px;}
}
</style>
</head>

<body>
<audio id="correctSound" src="./assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="./assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen">
  <img src="./assets/innovine-logo.png" alt="Logo">
</div>

<div id="gameScreen" class="screen">
  <div class="card">
    <div class="topBar">
      <span id="slideNo">Question 1 / 8</span>
      <span>Tap letters</span>
    </div>
    <img id="planetImage" class="planetImg" src="" alt="Planet">
    <div class="spellingTitle">Correct spelling</div>
    <div id="correctWord"></div>
    <div id="blankArea"></div>
    <div id="letterArea"></div>
    <div id="message"></div>
  </div>
</div>

<div id="finalScreen" class="screen">
  <h1>Well Done! 🎉</h1>
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
const questions = [
  {answer:"mercury", jumble:"errmcyu", image:"./assets/mercury.png"},
  {answer:"venus", jumble:"nvesu", image:"./assets/venus.png"},
  {answer:"earth", jumble:"erhat", image:"./assets/earth.png"},
  {answer:"mars", jumble:"mrsa", image:"./assets/mars.png"},
  {answer:"jupiter", jumble:"tpirjeu", image:"./assets/jupiter.png"},
  {answer:"saturn", jumble:"tsurna", image:"./assets/saturn.png"},
  {answer:"uranus", jumble:"nuausr", image:"./assets/uranus.png"},
  {answer:"neptune", jumble:"enunept", image:"./assets/neptune.png"}
];

let current = 0;
let selectedLetter = null;
let selectedButton = null;
let filledCount = 0;

const logoScreen = document.getElementById("logoScreen");
const gameScreen = document.getElementById("gameScreen");
const finalScreen = document.getElementById("finalScreen");

window.onload = function(){
  setTimeout(() => {
    logoScreen.style.display = "none";
    gameScreen.style.display = "flex";
    loadQuestion();
  }, 2000);
};

function playSound(id){
  const sound = document.getElementById(id);
  sound.currentTime = 0;
  sound.play().catch(()=>{});
}

function loadQuestion(){
  selectedLetter = null;
  selectedButton = null;
  filledCount = 0;

  const q = questions[current];
  document.getElementById("slideNo").innerText =
    "Question " + (current + 1) + " / " + questions.length;
  document.getElementById("planetImage").src = q.image;
  document.getElementById("correctWord").innerText = "";
  document.getElementById("message").innerText = "";

  createBlanks(q.answer);
  createLetters(q.jumble);
}

function createBlanks(answer){
  const blankArea = document.getElementById("blankArea");
  blankArea.innerHTML = "";
  for(let i=0;i<answer.length;i++){
    const blank = document.createElement("div");
    blank.className = "blank";
    blank.dataset.correct = answer[i];
    blank.onclick = function(){ placeLetter(blank); };
    blankArea.appendChild(blank);
  }
}

function createLetters(jumble){
  const letterArea = document.getElementById("letterArea");
  letterArea.innerHTML = "";
  jumble.split("").forEach(letter => {
    const btn = document.createElement("button");
    btn.className = "letter";
    btn.innerText = letter;
    btn.onclick = function(){
      selectedLetter = letter;
      selectedButton = btn;
      document.querySelectorAll(".letter").forEach(b => b.style.outline = "none");
      btn.style.outline = "3px solid #8e4d72";
    };
    letterArea.appendChild(btn);
  });
}

function placeLetter(blank){
  if(!selectedLetter || blank.innerText !== "") return;
  if(selectedLetter === blank.dataset.correct){
    blank.innerText = selectedLetter;
    selectedButton.classList.add("used");
    selectedButton.style.outline = "none";
    selectedLetter = null;
    selectedButton = null;
    filledCount++;
    playSound("correctSound");
    if(filledCount === questions[current].answer.length){
      document.getElementById("message").innerText = "Correct! 🌟";
      setTimeout(() => {
        current++;
        if(current < questions.length) loadQuestion();
        else showFinalScreen();
      }, 1000);
    }
  }else{
    playSound("wrongSound");
    document.getElementById("message").innerText = "Try again";
    setTimeout(() => { document.getElementById("message").innerText = ""; }, 800);
  }
}

function showFinalScreen(){
  gameScreen.style.display = "none";
  finalScreen.style.display = "flex";
  playSound("clapSound");
  createConfetti();
}

function createConfetti(){
  finalScreen.querySelectorAll(".confetti").forEach(c => c.remove());
  for(let i=0;i<45;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = ["#ff6b9a","#ffd166","#65d46e","#6ecbff","#b98cff"][i % 5];
    c.style.animationDelay = Math.random() * 2 + "s";
    finalScreen.appendChild(c);
  }
}

function restartGame(){
  current = 0;
  finalScreen.style.display = "none";
  logoScreen.style.display = "flex";
  setTimeout(() => {
    logoScreen.style.display = "none";
    gameScreen.style.display = "flex";
    loadQuestion();
  }, 2000);
}
</script>
</body>
</html>
