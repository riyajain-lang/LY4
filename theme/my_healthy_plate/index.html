<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>My Healthy Plate</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;
      font-family: Arial, sans-serif;
      background:#fff;
    }

    /* =====================================
       INTRO SCREEN
    ===================================== */

    #introScreen{
      position:fixed;
      inset:0;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
      animation:fadeOut 2s forwards;
      animation-delay:2s;
    }

    #introScreen img{
      width:240px;
      max-width:70%;
    }

    @keyframes fadeOut{
      to{
        opacity:0;
        visibility:hidden;
      }
    }

    /* =====================================
       MAIN GAME
    ===================================== */

    .game-container{
      width:100%;
      height:100vh;
      position:relative;
      overflow:hidden;

      background:
      linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)),
      url('https://i.pinimg.com/736x/0f/62/54/0f6254f915e1d1d3dc0975ec7f0b2451.jpg');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    .title{
      position:absolute;
      top:1%;
      width:100%;
      text-align:center;
      font-size:clamp(24px,4vw,42px);
      font-weight:bold;
      color:#ff6b00;
      text-shadow:2px 2px 5px white;
      z-index:5;
    }

    /* =====================================
       PLATE
    ===================================== */

    .plate-wrapper{
      position:absolute;
      top:10%;
      left:50%;
      transform:translateX(-50%);
      width:min(58vw,500px);
      aspect-ratio:1/1;
      z-index:2;
    }

    .plate{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      position:relative;
      border:14px solid white;
      box-shadow:0 0 25px rgba(0,0,0,0.25);
      background:white;
    }

    .section{
      position:absolute;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      padding:8px;
    }

    .section-label{
      position:absolute;
      font-weight:bold;
      background:rgba(255,255,255,0.85);
      padding:6px 12px;
      border-radius:15px;
      font-size:clamp(12px,1vw,18px);
      z-index:10;
    }

    .fruits{
      top:0;
      left:0;
      width:50%;
      height:50%;
      background:#ffe082;
      border-right:3px solid white;
      border-bottom:3px solid white;
    }

    .vegetables{
      top:0;
      right:0;
      width:50%;
      height:50%;
      background:#a5d6a7;
      border-left:3px solid white;
      border-bottom:3px solid white;
    }

    .grains{
      bottom:0;
      left:0;
      width:50%;
      height:50%;
      background:#ffcc80;
      border-right:3px solid white;
      border-top:3px solid white;
    }

    .protein{
      bottom:0;
      right:0;
      width:50%;
      height:50%;
      background:#ef9a9a;
      border-left:3px solid white;
      border-top:3px solid white;
    }

    .dairy{
      width:30%;
      height:30%;
      border-radius:50%;
      background:#90caf9;
      border:5px solid white;
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:5;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      padding:5px;
    }

    .fruit-label{
      top:10px;
      left:10px;
    }

    .veg-label{
      top:10px;
      right:10px;
    }

    .grain-label{
      bottom:10px;
      left:10px;
    }

    .protein-label{
      bottom:10px;
      right:10px;
    }

    .dairy-label{
      position:relative;
    }

    /* =====================================
       FOOD OPTIONS
    ===================================== */

    .food-container{
      position:absolute;
      bottom:1%;
      left:50%;
      transform:translateX(-50%);
      width:98%;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      z-index:10;
    }

    .food{
      width:72px;
      height:72px;
      background:white;
      border-radius:18px;
      border:3px solid #ffb74d;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:grab;
      touch-action:none;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      transition:0.2s;
    }

    .food img{
      width:60px;
      height:60px;
      object-fit:contain;
      pointer-events:none;
    }

    .food:active{
      transform:scale(1.08);
    }

    .correct{
      border-color:#43a047 !important;
      background:#dcedc8 !important;
    }

    /* =====================================
       SUCCESS POPUP
    ===================================== */

    .success{
      position:absolute;
      top:45%;
      left:50%;
      transform:translate(-50%,-50%);
      background:white;
      padding:25px 35px;
      border-radius:20px;
      font-size:clamp(24px,4vw,42px);
      font-weight:bold;
      color:#ff6b00;
      display:none;
      z-index:999;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
      text-align:center;
    }

    /* =====================================
       RESPONSIVE
    ===================================== */

    @media(max-width:768px){

      .plate-wrapper{
        width:78vw;
        top:11%;
      }

      .food{
        width:58px;
        height:58px;
      }

      .food img{
        width:48px;
        height:48px;
      }

      .food-container{
        gap:6px;
      }

      .section-label{
        font-size:11px;
        padding:4px 8px;
      }
    }

    @media(max-height:700px){

      .plate-wrapper{
        width:50vh;
      }

      .food{
        width:52px;
        height:52px;
      }

      .food img{
        width:42px;
        height:42px;
      }
    }

  </style>
</head>

<body>

  <!-- INTRO SCREEN -->
  <div id="introScreen">
    <img src="assets/innovine-logo.png" alt="Logo">
  </div>

  <!-- GAME -->
  <div class="game-container">

    <div class="title">
      🍽️ My Healthy Plate 🍎
    </div>

    <!-- PLATE -->
    <div class="plate-wrapper">

      <div class="plate">

        <!-- FRUITS -->
        <div class="section fruits dropzone" data-group="fruits">
          <div class="section-label fruit-label">🍎 Fruits</div>
        </div>

        <!-- VEGETABLES -->
        <div class="section vegetables dropzone" data-group="vegetables">
          <div class="section-label veg-label">🥦 Vegetables</div>
        </div>

        <!-- GRAINS -->
        <div class="section grains dropzone" data-group="grains">
          <div class="section-label grain-label">🌾 Grains</div>
        </div>

        <!-- PROTEIN -->
        <div class="section protein dropzone" data-group="protein">
          <div class="section-label protein-label">🥚 Protein</div>
        </div>

        <!-- DAIRY -->
        <div class="dairy dropzone" data-group="dairy">
          <div class="section-label dairy-label">🥛 Dairy</div>
        </div>

      </div>

    </div>

    <!-- FOOD ITEMS -->
    <div class="food-container" id="foodContainer">

      <!-- FRUITS -->
      <div class="food" draggable="true" data-group="fruits">
        <img src="assets/banana.png">
      </div>

      <div class="food" draggable="true" data-group="fruits">
        <img src="assets/apple.png">
      </div>

      <div class="food" draggable="true" data-group="fruits">
        <img src="assets/orange.png">
      </div>

      <!-- VEGETABLES -->
      <div class="food" draggable="true" data-group="vegetables">
        <img src="assets/spinach.png">
      </div>

      <div class="food" draggable="true" data-group="vegetables">
        <img src="assets/broccoli.png">
      </div>

      <div class="food" draggable="true" data-group="vegetables">
        <img src="assets/carrot.png">
      </div>

      <!-- GRAINS -->
      <div class="food" draggable="true" data-group="grains">
        <img src="assets/brown-rice.png">
      </div>

      <div class="food" draggable="true" data-group="grains">
        <img src="assets/oats.png">
      </div>

      <div class="food" draggable="true" data-group="grains">
        <img src="assets/whole-wheat-bread.png">
      </div>

      <!-- PROTEIN -->
      <div class="food" draggable="true" data-group="protein">
        <img src="assets/lentils.png">
      </div>

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/beans.png">
      </div>

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/egg.png">
      </div>

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/paneer.png">
      </div>

      <!-- DAIRY -->
      <div class="food" draggable="true" data-group="dairy">
        <img src="assets/yogurt.png">
      </div>

      <div class="food" draggable="true" data-group="dairy">
        <img src="assets/buttermilk.png">
      </div>

    </div>

    <!-- SUCCESS -->
    <div class="success" id="successMessage">
      🎉 Great Job! 🎉
    </div>

  </div>

  <!-- AUDIO -->
  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>
  <audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

  <script>

    const foods = document.querySelectorAll('.food');
    const zones = document.querySelectorAll('.dropzone');

    const correctSound = document.getElementById('correctSound');
    const wrongSound = document.getElementById('wrongSound');
    const clapSound = document.getElementById('clapSound');

    let draggedFood = null;
    let completed = 0;

    // =====================================
    // DESKTOP DRAG DROP
    // =====================================

    foods.forEach(food => {

      food.addEventListener('dragstart', () => {
        draggedFood = food;
      });

    });

    zones.forEach(zone => {

      zone.addEventListener('dragover', (e)=>{
        e.preventDefault();
      });

      zone.addEventListener('drop', ()=>{

        if(!draggedFood) return;

        const foodGroup = draggedFood.dataset.group;
        const zoneGroup = zone.dataset.group;

        if(foodGroup === zoneGroup){

          zone.appendChild(draggedFood);

          draggedFood.classList.add('correct');
          draggedFood.setAttribute('draggable','false');

          draggedFood.style.position='relative';
          draggedFood.style.left='0';
          draggedFood.style.top='0';
          draggedFood.style.margin='4px';

          correctSound.currentTime = 0;
          clapSound.currentTime = 0;

          correctSound.play();
          clapSound.play();

          completed++;

          if(completed === foods.length){

            setTimeout(()=>{
              document.getElementById('successMessage').style.display='block';
            },500);

          }

        } else {

          wrongSound.currentTime = 0;
          wrongSound.play();

        }

      });

    });

    // =====================================
    // TOUCH SUPPORT
    // =====================================

    let activeFood = null;
    let offsetX = 0;
    let offsetY = 0;

    foods.forEach(food => {

      food.addEventListener('touchstart',(e)=>{

        if(food.classList.contains('correct')) return;

        activeFood = food;

        const touch = e.touches[0];
        const rect = food.getBoundingClientRect();

        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;

        food.style.position='fixed';
        food.style.zIndex='9999';

      });

      food.addEventListener('touchmove',(e)=>{

        if(!activeFood) return;

        e.preventDefault();

        const touch = e.touches[0];

        activeFood.style.left = (touch.clientX - offsetX) + 'px';
        activeFood.style.top = (touch.clientY - offsetY) + 'px';

      }, {passive:false});

      food.addEventListener('touchend',(e)=>{

        if(!activeFood) return;

        const touch = e.changedTouches[0];

        let dropped = false;

        zones.forEach(zone=>{

          const rect = zone.getBoundingClientRect();

          if(
            touch.clientX > rect.left &&
            touch.clientX < rect.right &&
            touch.clientY > rect.top &&
            touch.clientY < rect.bottom
          ){

            const foodGroup = activeFood.dataset.group;
            const zoneGroup = zone.dataset.group;

            if(foodGroup === zoneGroup){

              zone.appendChild(activeFood);

              activeFood.classList.add('correct');

              activeFood.style.position='relative';
              activeFood.style.left='0';
              activeFood.style.top='0';
              activeFood.style.zIndex='1';
              activeFood.style.margin='4px';

              activeFood.setAttribute('draggable','false');

              correctSound.currentTime = 0;
              clapSound.currentTime = 0;

              correctSound.play();
              clapSound.play();

              completed++;

              if(completed === foods.length){

                setTimeout(()=>{
                  document.getElementById('successMessage').style.display='block';
                },500);

              }

            } else {

              wrongSound.currentTime = 0;
              wrongSound.play();

              activeFood.style.position='relative';
              activeFood.style.left='0';
              activeFood.style.top='0';

              document.getElementById('foodContainer').appendChild(activeFood);

            }

            dropped = true;

          }

        });

        if(!dropped){

          activeFood.style.position='relative';
          activeFood.style.left='0';
          activeFood.style.top='0';

          document.getElementById('foodContainer').appendChild(activeFood);

        }

        activeFood = null;

      });

    });

  </script>

</body>
</html>
