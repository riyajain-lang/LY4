<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

  <title>My Healthy Plate</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;
      font-family:Arial, sans-serif;
      background:#f9f4ea;
    }

    /* ===================================
       INTRO SCREEN
    =================================== */

    #introScreen{
      position:fixed;
      inset:0;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      animation:fadeOut 2s forwards;
      animation-delay:2s;
    }

    #introScreen img{
      width:240px;
      max-width:70%;
    }

    @keyframes fadeOut{
      to{
        opacity:0;
        visibility:hidden;
      }
    }

    /* ===================================
       MAIN GAME BACKGROUND
    =================================== */

    .game-container{
      width:100%;
      height:100vh;
      position:relative;
      overflow:hidden;

      /* Dining setup background */
      background:
      linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)),
      url('https://i.pinimg.com/736x/68/ca/8f/68ca8fd145cf71f3eb6d80e6738d6f9f.jpg');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    /* soft overlay */

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.18);
    }

    /* ===================================
       TITLE
    =================================== */

    .title{
      position:absolute;
      top:1%;
      width:100%;
      text-align:center;
      font-size:clamp(26px,4vw,58px);
      font-weight:bold;
      color:#ff6b00;
      text-shadow:3px 3px 8px rgba(255,255,255,0.9);
      z-index:10;
    }

    /* ===================================
       INSTRUCTIONS
    =================================== */

    .instructions{
      position:absolute;
      top:10%;
      width:100%;
      text-align:center;
      font-size:clamp(13px,1.2vw,20px);
      font-weight:bold;
      color:#4e342e;
      z-index:10;
      text-shadow:1px 1px 3px white;
      padding:0 10px;
    }

    /* ===================================
       PLATE
    =================================== */

    .plate-wrapper{
      position:absolute;
      top:15%;
      left:50%;
      transform:translateX(-50%);
      width:min(50vw,650px);
      aspect-ratio:1/1;
      z-index:5;
    }

    .plate{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      position:relative;

      border:18px solid #fafafa;

      background:white;

      box-shadow:
      0 0 35px rgba(0,0,0,0.25),
      inset 0 0 10px rgba(255,255,255,0.8);
    }

    .section{
      position:absolute;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      padding:10px;
    }

    .section-label{
      position:absolute;
      background:rgba(255,255,255,0.9);
      padding:8px 14px;
      border-radius:20px;
      font-weight:bold;
      font-size:clamp(13px,1vw,20px);
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
      z-index:20;
    }

    /* Fruits */
    .fruits{
      top:0;
      left:0;
      width:50%;
      height:50%;
      background:#ffe082;
      border-right:4px solid white;
      border-bottom:4px solid white;
    }

    /* Vegetables */
    .vegetables{
      top:0;
      right:0;
      width:50%;
      height:50%;
      background:#a5d6a7;
      border-left:4px solid white;
      border-bottom:4px solid white;
    }

    /* Grains */
    .grains{
      bottom:0;
      left:0;
      width:50%;
      height:50%;
      background:#ffcc80;
      border-right:4px solid white;
      border-top:4px solid white;
    }

    /* Protein */
    .protein{
      bottom:0;
      right:0;
      width:50%;
      height:50%;
      background:#ef9a9a;
      border-left:4px solid white;
      border-top:4px solid white;
    }

    /* Dairy center */

    .dairy{
      width:30%;
      height:30%;
      border-radius:50%;
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      background:#90caf9;
      border:7px solid white;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      z-index:20;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    /* label positions */

    .fruit-label{
      top:14px;
      left:14px;
    }

    .veg-label{
      top:14px;
      right:14px;
    }

    .grain-label{
      bottom:14px;
      left:14px;
    }

    .protein-label{
      bottom:14px;
      right:14px;
    }

    .dairy-label{
      position:relative;
    }

    /* ===================================
       FOOD OPTIONS
    =================================== */

    .food-container{
      position:absolute;
      bottom:1%;
      left:50%;
      transform:translateX(-50%);
      width:98%;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      z-index:20;
    }

    .food{
      width:80px;
      height:80px;
      background:white;
      border-radius:20px;
      border:4px solid #ffb74d;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:grab;
      touch-action:none;

      box-shadow:
      0 4px 10px rgba(0,0,0,0.2);

      transition:0.2s;
    }

    .food:hover{
      transform:scale(1.08);
    }

    .food img{
      width:65px;
      height:65px;
      object-fit:contain;
      pointer-events:none;
    }

    .correct{
      border-color:#43a047 !important;
      background:#dcedc8 !important;
    }

    /* ===================================
       SUCCESS POPUP
    =================================== */

    .success{
      position:absolute;
      top:45%;
      left:50%;
      transform:translate(-50%,-50%);
      background:white;
      padding:25px 35px;
      border-radius:24px;
      font-size:clamp(24px,4vw,48px);
      font-weight:bold;
      color:#ff6b00;
      display:none;
      z-index:999;

      box-shadow:0 0 25px rgba(0,0,0,0.35);
    }

    /* ===================================
       RESPONSIVE
    =================================== */

    @media(max-width:768px){

      .title{
        font-size:40px;
      }

      .instructions{
        top:9%;
        font-size:12px;
      }

      .plate-wrapper{
        width:88vw;
        top:14%;
      }

      .food{
        width:58px;
        height:58px;
      }

      .food img{
        width:46px;
        height:46px;
      }

      .food-container{
        gap:6px;
        bottom:1%;
      }

      .section-label{
        font-size:11px;
        padding:5px 9px;
      }
    }

    @media(max-height:700px){

      .plate-wrapper{
        width:60vh;
      }

      .food{
        width:52px;
        height:52px;
      }

      .food img{
        width:40px;
        height:40px;
      }
    }

  </style>
</head>

<body>

  <!-- INTRO SCREEN -->

  <div id="introScreen">
    <img src="assets/innovine-logo.png" alt="logo">
  </div>

  <!-- GAME -->

  <div class="game-container">

    <div class="overlay"></div>

    <!-- TITLE -->

    <div class="title">
      🍽️ My Healthy Plate 🍎
    </div>

    <!-- INSTRUCTIONS -->

    <div class="instructions">
      Drag each food item to the correct food group on the healthy plate.
    </div>

    <!-- PLATE -->

    <div class="plate-wrapper">

      <div class="plate">

        <!-- FRUITS -->

        <div class="section fruits dropzone" data-group="fruits">
          <div class="section-label fruit-label">
            🍎 Fruits
          </div>
        </div>

        <!-- VEGETABLES -->

        <div class="section vegetables dropzone" data-group="vegetables">
          <div class="section-label veg-label">
            🥦 Vegetables
          </div>
        </div>

        <!-- GRAINS -->

        <div class="section grains dropzone" data-group="grains">
          <div class="section-label grain-label">
            🌾 Grains
          </div>
        </div>

        <!-- PROTEIN -->

        <div class="section protein dropzone" data-group="protein">
          <div class="section-label protein-label">
            🥚 Protein
          </div>
        </div>

        <!-- DAIRY -->

        <div class="dairy dropzone" data-group="dairy">
          <div class="section-label dairy-label">
            🥛 Dairy
          </div>
        </div>

      </div>

    </div>

    <!-- FOOD OPTIONS -->

    <div class="food-container" id="foodContainer">

      <!-- Fruits -->

      <div class="food" draggable="true" data-group="fruits">
        <img src="assets/banana.png">
      </div>

      <div class="food" draggable="true" data-group="fruits">
        <img src="assets/apple.png">
      </div>

      <div class="food" draggable="true" data-group="fruits">
        <img src="assets/orange.png">
      </div>

      <!-- Vegetables -->

      <div class="food" draggable="true" data-group="vegetables">
        <img src="assets/spinach.png">
      </div>

      <div class="food" draggable="true" data-group="vegetables">
        <img src="assets/broccoli.png">
      </div>

      <div class="food" draggable="true" data-group="vegetables">
        <img src="assets/carrot.png">
      </div>

      <!-- Grains -->

      <div class="food" draggable="true" data-group="grains">
        <img src="assets/brown-rice.png">
      </div>

      <div class="food" draggable="true" data-group="grains">
        <img src="assets/oats.png">
      </div>

      <div class="food" draggable="true" data-group="grains">
        <img src="assets/whole-wheat-bread.png">
      </div>

      <!-- Protein -->

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/lentils.png">
      </div>

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/beans.png">
      </div>

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/egg.png">
      </div>

      <div class="food" draggable="true" data-group="protein">
        <img src="assets/paneer.png">
      </div>

      <!-- Dairy -->

      <div class="food" draggable="true" data-group="dairy">
        <img src="assets/yogurt.png">
      </div>

      <div class="food" draggable="true" data-group="dairy">
        <img src="assets/buttermilk.png">
      </div>

    </div>

    <!-- SUCCESS -->

    <div class="success" id="successMessage">
      🎉 Great Job! 🎉
    </div>

  </div>

  <!-- AUDIO -->

  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>
  <audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

  <script>

    const foods = document.querySelectorAll('.food');
    const zones = document.querySelectorAll('.dropzone');

    const correctSound = document.getElementById('correctSound');
    const wrongSound = document.getElementById('wrongSound');
    const clapSound = document.getElementById('clapSound');

    let draggedFood = null;
    let completed = 0;

    /* ===================================
       DESKTOP DRAG
    =================================== */

    foods.forEach(food=>{

      food.addEventListener('dragstart',()=>{
        draggedFood = food;
      });

    });

    zones.forEach(zone=>{

      zone.addEventListener('dragover',(e)=>{
        e.preventDefault();
      });

      zone.addEventListener('drop',()=>{

        if(!draggedFood) return;

        const foodGroup = draggedFood.dataset.group;
        const zoneGroup = zone.dataset.group;

        if(foodGroup === zoneGroup){

          zone.appendChild(draggedFood);

          draggedFood.classList.add('correct');

          draggedFood.style.position='relative';
          draggedFood.style.left='0';
          draggedFood.style.top='0';
          draggedFood.style.margin='4px';

          draggedFood.setAttribute('draggable','false');

          correctSound.currentTime = 0;
          clapSound.currentTime = 0;

          correctSound.play();
          clapSound.play();

          completed++;

          if(completed === foods.length){

            setTimeout(()=>{
              document.getElementById('successMessage').style.display='block';
            },500);

          }

        } else {

          wrongSound.currentTime = 0;
          wrongSound.play();

        }

      });

    });

    /* ===================================
       TOUCH SUPPORT
    =================================== */

    let activeFood = null;
    let offsetX = 0;
    let offsetY = 0;

    foods.forEach(food=>{

      food.addEventListener('touchstart',(e)=>{

        if(food.classList.contains('correct')) return;

        activeFood = food;

        const touch = e.touches[0];
        const rect = food.getBoundingClientRect();

        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;

        food.style.position='fixed';
        food.style.zIndex='9999';

      });

      food.addEventListener('touchmove',(e)=>{

        if(!activeFood) return;

        e.preventDefault();

        const touch = e.touches[0];

        activeFood.style.left =
        (touch.clientX - offsetX) + 'px';

        activeFood.style.top =
        (touch.clientY - offsetY) + 'px';

      }, {passive:false});

      food.addEventListener('touchend',(e)=>{

        if(!activeFood) return;

        const touch = e.changedTouches[0];

        let dropped = false;

        zones.forEach(zone=>{

          const rect = zone.getBoundingClientRect();

          if(
            touch.clientX > rect.left &&
            touch.clientX < rect.right &&
            touch.clientY > rect.top &&
            touch.clientY < rect.bottom
          ){

            const foodGroup =
            activeFood.dataset.group;

            const zoneGroup =
            zone.dataset.group;

            if(foodGroup === zoneGroup){

              zone.appendChild(activeFood);

              activeFood.classList.add('correct');

              activeFood.style.position='relative';
              activeFood.style.left='0';
              activeFood.style.top='0';
              activeFood.style.zIndex='1';
              activeFood.style.margin='4px';

              activeFood.setAttribute('draggable','false');

              correctSound.currentTime = 0;
              clapSound.currentTime = 0;

              correctSound.play();
              clapSound.play();

              completed++;

              if(completed === foods.length){

                setTimeout(()=>{
                  document.getElementById('successMessage').style.display='block';
                },500);

              }

            } else {

              wrongSound.currentTime = 0;
              wrongSound.play();

              activeFood.style.position='relative';
              activeFood.style.left='0';
              activeFood.style.top='0';

              document.getElementById('foodContainer')
              .appendChild(activeFood);

            }

            dropped = true;
          }

        });

        if(!dropped){

          activeFood.style.position='relative';
          activeFood.style.left='0';
          activeFood.style.top='0';

          document.getElementById('foodContainer')
          .appendChild(activeFood);

        }

        activeFood = null;

      });

    });

  </script>

</body>
</html>
