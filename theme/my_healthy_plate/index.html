<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>My Healthy Plate</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    body{
      overflow:hidden;
      font-family: Arial, sans-serif;
      width:100vw;
      height:100vh;
      background:#fff7ea;
    }

    /* =========================
       INTRO SCREEN
    ==========================*/
    #introScreen{
      position:fixed;
      inset:0;
      background:white;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:100;
      animation: hideIntro 2s forwards;
      animation-delay:2s;
    }

    #introScreen img{
      width:220px;
      max-width:70%;
    }

    @keyframes hideIntro{
      to{
        opacity:0;
        visibility:hidden;
      }
    }

    /* =========================
       MAIN GAME
    ==========================*/
    .game-container{
      width:100%;
      height:100vh;
      position:relative;
      overflow:hidden;

      background:
      linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)),
      url('https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?q=80&w=1400&auto=format&fit=crop') center center/cover no-repeat;
    }

    /* Soft overlay */
    .overlay{
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.35);
    }

    .title{
      position:absolute;
      top:1%;
      width:100%;
      text-align:center;
      font-size:clamp(22px,4vw,40px);
      font-weight:bold;
      color:#ff6b00;
      text-shadow:2px 2px 6px white;
      z-index:3;
    }

    /* =========================
       PLATE
    ==========================*/
    .plate-wrapper{
      position:absolute;
      top:10%;
      left:50%;
      transform:translateX(-50%);
      width:min(55vw, 480px);
      aspect-ratio:1/1;
      z-index:2;
    }

    .plate{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      position:relative;
      border:12px solid white;
      box-shadow:0 0 25px rgba(0,0,0,0.25);
      background:white;
    }

    .section{
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-weight:bold;
      font-size:clamp(13px,1.4vw,20px);
      color:#333;
      padding:5px;
    }

    .section span{
      background:rgba(255,255,255,0.8);
      padding:6px 10px;
      border-radius:12px;
    }

    /* Fruits */
    .fruits{
      top:0;
      left:0;
      width:50%;
      height:50%;
      background:#ffd54f;
      border-right:3px solid white;
      border-bottom:3px solid white;
    }

    /* Vegetables */
    .vegetables{
      top:0;
      right:0;
      width:50%;
      height:50%;
      background:#81c784;
      border-left:3px solid white;
      border-bottom:3px solid white;
    }

    /* Grains */
    .grains{
      bottom:0;
      left:0;
      width:50%;
      height:50%;
      background:#ffcc80;
      border-right:3px solid white;
      border-top:3px solid white;
    }

    /* Protein */
    .protein{
      bottom:0;
      right:0;
      width:50%;
      height:50%;
      background:#ef9a9a;
      border-left:3px solid white;
      border-top:3px solid white;
    }

    /* Dairy circle */
    .dairy{
      width:30%;
      height:30%;
      border-radius:50%;
      background:#90caf9;
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      border:5px solid white;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-weight:bold;
      color:#333;
      font-size:clamp(12px,1.2vw,18px);
    }

    /* =========================
       FOOD OPTIONS
    ==========================*/
    .food-container{
      position:absolute;
      bottom:1%;
      left:50%;
      transform:translateX(-50%);
      width:96%;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      z-index:4;
    }

    .food{
      background:white;
      border-radius:16px;
      padding:10px 14px;
      border:3px solid #ffb74d;
      font-weight:bold;
      color:#333;
      cursor:grab;
      touch-action:none;
      font-size:clamp(12px,1vw,18px);
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
      transition:0.2s;
    }

    .food:active{
      transform:scale(1.08);
      cursor:grabbing;
    }

    .correct{
      background:#a5d6a7 !important;
      border-color:#43a047 !important;
      color:#1b5e20;
    }

    /* =========================
       SUCCESS MESSAGE
    ==========================*/
    .success{
      position:absolute;
      top:45%;
      left:50%;
      transform:translate(-50%,-50%);
      background:white;
      padding:20px 30px;
      border-radius:20px;
      font-size:clamp(22px,3vw,40px);
      font-weight:bold;
      color:#ff6b00;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
      display:none;
      z-index:10;
      text-align:center;
    }

    /* =========================
       RESPONSIVE
    ==========================*/
    @media(max-width:768px){

      .plate-wrapper{
        width:78vw;
        top:10%;
      }

      .food-container{
        gap:6px;
      }

      .food{
        padding:8px 10px;
        font-size:13px;
      }
    }

    @media(max-height:700px){

      .plate-wrapper{
        width:52vh;
      }

      .food{
        padding:6px 8px;
        font-size:12px;
      }
    }

  </style>
</head>

<body>

  <!-- INTRO SCREEN -->
  <div id="introScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
  </div>

  <!-- MAIN GAME -->
  <div class="game-container">

    <div class="overlay"></div>

    <div class="title">
      🍎 My Healthy Plate 🍽️
    </div>

    <!-- PLATE -->
    <div class="plate-wrapper">

      <div class="plate">

        <div class="section fruits dropzone" data-group="fruits">
          <span>🍎 Fruits</span>
        </div>

        <div class="section vegetables dropzone" data-group="vegetables">
          <span>🥦 Vegetables</span>
        </div>

        <div class="section grains dropzone" data-group="grains">
          <span>🌾 Grains</span>
        </div>

        <div class="section protein dropzone" data-group="protein">
          <span>🥚 Protein</span>
        </div>

        <div class="dairy dropzone" data-group="dairy">
          🥛 Dairy
        </div>

      </div>

    </div>

    <!-- FOOD ITEMS -->
    <div class="food-container" id="foodContainer">

      <div class="food" draggable="true" data-group="fruits">Banana</div>
      <div class="food" draggable="true" data-group="vegetables">Spinach</div>
      <div class="food" draggable="true" data-group="vegetables">Broccoli</div>
      <div class="food" draggable="true" data-group="vegetables">Carrot</div>

      <div class="food" draggable="true" data-group="grains">Brown Rice</div>
      <div class="food" draggable="true" data-group="grains">Oats</div>
      <div class="food" draggable="true" data-group="grains">Whole Wheat Bread</div>

      <div class="food" draggable="true" data-group="protein">Lentils</div>
      <div class="food" draggable="true" data-group="protein">Beans</div>
      <div class="food" draggable="true" data-group="protein">Eggs</div>
      <div class="food" draggable="true" data-group="protein">Paneer</div>

      <div class="food" draggable="true" data-group="fruits">Orange</div>
      <div class="food" draggable="true" data-group="fruits">Apple</div>

      <div class="food" draggable="true" data-group="dairy">Buttermilk</div>
      <div class="food" draggable="true" data-group="dairy">Yogurt</div>

    </div>

    <div class="success" id="successMessage">
      🎉 Great Job! 🎉
    </div>

  </div>

  <!-- AUDIO -->
  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>
  <audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

  <script>

    const foods = document.querySelectorAll('.food');
    const zones = document.querySelectorAll('.dropzone');

    const correctSound = document.getElementById('correctSound');
    const wrongSound = document.getElementById('wrongSound');
    const clapSound = document.getElementById('clapSound');

    let draggedFood = null;
    let completed = 0;

    // =========================
    // DRAG EVENTS
    // =========================
    foods.forEach(food => {

      food.addEventListener('dragstart', () => {
        draggedFood = food;
      });

    });

    zones.forEach(zone => {

      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

      zone.addEventListener('drop', () => {

        if(!draggedFood) return;

        const correctGroup = draggedFood.dataset.group;
        const zoneGroup = zone.dataset.group;

        if(correctGroup === zoneGroup){

          zone.appendChild(draggedFood);

          draggedFood.classList.add('correct');
          draggedFood.setAttribute('draggable', 'false');

          draggedFood.style.margin = "4px";
          draggedFood.style.position = "relative";
          draggedFood.style.left = "0";
          draggedFood.style.top = "0";

          correctSound.currentTime = 0;
          clapSound.currentTime = 0;

          correctSound.play();
          clapSound.play();

          completed++;

          if(completed === foods.length){

            setTimeout(()=>{
              document.getElementById('successMessage').style.display='block';
            },500);

          }

        } else {

          wrongSound.currentTime = 0;
          wrongSound.play();

        }

      });

    });

    // =========================
    // TOUCH SUPPORT
    // =========================
    let activeFood = null;
    let offsetX = 0;
    let offsetY = 0;

    foods.forEach(food => {

      food.addEventListener('touchstart', (e) => {

        if(food.classList.contains('correct')) return;

        activeFood = food;

        const touch = e.touches[0];
        const rect = food.getBoundingClientRect();

        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;

        food.style.position = 'fixed';
        food.style.zIndex = '9999';

      });

      food.addEventListener('touchmove', (e) => {

        if(!activeFood) return;

        e.preventDefault();

        const touch = e.touches[0];

        activeFood.style.left = (touch.clientX - offsetX) + 'px';
        activeFood.style.top = (touch.clientY - offsetY) + 'px';

      }, {passive:false});

      food.addEventListener('touchend', (e) => {

        if(!activeFood) return;

        const touch = e.changedTouches[0];

        let dropped = false;

        zones.forEach(zone => {

          const rect = zone.getBoundingClientRect();

          if(
            touch.clientX > rect.left &&
            touch.clientX < rect.right &&
            touch.clientY > rect.top &&
            touch.clientY < rect.bottom
          ){

            const correctGroup = activeFood.dataset.group;
            const zoneGroup = zone.dataset.group;

            if(correctGroup === zoneGroup){

              zone.appendChild(activeFood);

              activeFood.classList.add('correct');
              activeFood.style.position = 'relative';
              activeFood.style.left = '0';
              activeFood.style.top = '0';
              activeFood.style.zIndex = '1';

              activeFood.setAttribute('draggable', 'false');

              correctSound.currentTime = 0;
              clapSound.currentTime = 0;

              correctSound.play();
              clapSound.play();

              completed++;

              if(completed === foods.length){

                setTimeout(()=>{
                  document.getElementById('successMessage').style.display='block';
                },500);

              }

            } else {

              wrongSound.currentTime = 0;
              wrongSound.play();

              activeFood.style.position = 'relative';
              activeFood.style.left = '0';
              activeFood.style.top = '0';

              document.getElementById('foodContainer').appendChild(activeFood);

            }

            dropped = true;
          }

        });

        if(!dropped){

          activeFood.style.position = 'relative';
          activeFood.style.left = '0';
          activeFood.style.top = '0';

          document.getElementById('foodContainer').appendChild(activeFood);

        }

        activeFood = null;

      });

    });

  </script>

</body>
</html>
