<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LY4 Tap on Shapes</title>
<style>
    body {
        margin:0;
        font-family: 'Arbutus', cursive;
        background: #ffe6f0; /* pastel pink similar to worksheet */
        display:flex;
        flex-direction:column;
        align-items:center;
        min-height:100vh;
        overflow:hidden;
    }
    #splash, #game, #endScreen {
        width:100%;
        height:100vh;
        display:none;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        position:relative;
    }
    #splash img {
        width:200px;
        height:auto;
    }
    #questionBox {
        margin:10px 0;
        text-align:center;
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:20px;
    }
    .option {
        width:80px;
        height:80px;
        display:flex;
        align-items:center;
        justify-content:center;
        border:2px solid #ccc;
        border-radius:12px;
        cursor:pointer;
        transition: transform 0.2s;
        background:white;
    }
    .option.correct {
        border-color:green;
    }
    .option.wrong {
        animation: shake 0.3s;
        border-color:red;
    }
    @keyframes shake {
        0% { transform: translateX(0px); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0px); }
    }
    #instruction {
        font-size:1.2em;
        margin-bottom:15px;
        color:#333;
    }
    #endScreen h1 {
        font-size:2em;
        margin:10px;
        color:#4b2e83;
    }
    #playAgain {
        margin-top:20px;
        padding:10px 20px;
        font-size:1.2em;
        cursor:pointer;
        border:none;
        border-radius:8px;
        background:#ff99cc;
        color:white;
    }
    canvas#confetti {
        position:absolute;
        top:0;
        left:0;
        pointer-events:none;
    }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="game">
    <div id="instruction">Tap on the correct shape!</div>
    <div id="questionBox"></div>
</div>

<!-- End Screen -->
<div id="endScreen">
    <canvas id="confetti"></canvas>
    <h1>Good Job!</h1>
    <button id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');
const questionBox = document.getElementById('questionBox');
const playAgain = document.getElementById('playAgain');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

// --- Confetti ---
const confettiCanvas = document.getElementById('confetti');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
function initConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
    confettiParticles = [];
    for(let i=0;i<150;i++){
        confettiParticles.push({
            x:Math.random()*confettiCanvas.width,
            y:Math.random()*confettiCanvas.height- confettiCanvas.height,
            r:Math.random()*6+4,
            d:Math.random()*150+50,
            color:`hsl(${Math.random()*360}, 70%, 60%)`,
            tilt:Math.random()*10-10
        });
    }
}
function drawConfetti(){
    confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    confettiParticles.forEach(p=>{
        confettiCtx.beginPath();
        confettiCtx.moveTo(p.x + p.tilt + p.r/2, p.y);
        confettiCtx.lineTo(p.x + p.tilt, p.y + p.r);
        confettiCtx.lineTo(p.x + p.tilt - p.r/2, p.y);
        confettiCtx.closePath();
        confettiCtx.fillStyle = p.color;
        confettiCtx.fill();
    });
}
function updateConfetti(){
    confettiParticles.forEach(p=>{
        p.y += Math.cos(0.01*p.d)+1+p.r/2;
        p.x += Math.sin(0.01*p.d);
        if(p.y>confettiCanvas.height){
            p.y = -10;
            p.x = Math.random()*confettiCanvas.width;
        }
    });
    drawConfetti();
    requestAnimationFrame(updateConfetti);
}

// --- Game Data ---
const questions = [
    {
        // Slide 2
        pattern:['circle','triangle','square'],
        options:['circle','triangle','square'],
        answer:'circle'
    },
    {
        // Slide 3
        pattern:['star','rectangle','semicircle'],
        options:['star','rectangle','semicircle'],
        answer:'star'
    },
    {
        pattern:['triangle','moon','square'],
        options:['triangle','moon','square'],
        answer:'moon'
    },
    {
        pattern:['circle','diamond','semicircle'],
        options:['diamond','circle','semicircle'],
        answer:'diamond'
    },
    {
        pattern:['oval','triangle','rectangle'],
        options:['oval','triangle','rectangle'],
        answer:'rectangle'
    },
    {
        pattern:['star','diamond','circle'],
        options:['star','diamond','circle'],
        answer:'circle'
    },
    {
        pattern:['moon','triangle','star'],
        options:['moon','triangle','star'],
        answer:'triangle'
    },
    {
        pattern:['square','oval','star'],
        options:['square','oval','star'],
        answer:'star'
    },
    {
        pattern:['triangle','circle','diamond'],
        options:['triangle','circle','diamond'],
        answer:'circle'
    },
    {
        pattern:['semicircle','star','diamond'],
        options:['semicircle','star','diamond'],
        answer:'semicircle'
    }
];

let currentQuestion = 0;
let attempts = 0;

// --- Functions ---
function showQuestion(){
    questionBox.innerHTML = '';
    attempts = 0;
    const q = questions[currentQuestion];
    q.options.forEach(option=>{
        const div = document.createElement('div');
        div.classList.add('option');
        div.dataset.shape = option;
        div.innerHTML = `<img src="assets/${option}.png" alt="${option}" style="width:60px;height:60px;">`;
        div.addEventListener('click', checkAnswer);
        questionBox.appendChild(div);
    });
}

function checkAnswer(e){
    const selected = e.currentTarget.dataset.shape;
    const correct = questions[currentQuestion].answer;
    if(selected===correct){
        e.currentTarget.classList.add('correct');
        correctSound.play();
        clapSound.play();
        setTimeout(()=>{
            currentQuestion++;
            if(currentQuestion<questions.length){
                showQuestion();
            } else {
                endGame();
            }
        },1000);
    } else {
        e.currentTarget.classList.add('wrong');
        wrongSound.play();
        attempts++;
        if(attempts>=2){
            // highlight correct
            Array.from(document.querySelectorAll('.option')).forEach(opt=>{
                if(opt.dataset.shape===correct){
                    opt.classList.add('correct');
                }
            });
        }
    }
}

function endGame(){
    game.style.display='none';
    endScreen.style.display='flex';
    initConfetti();
    updateConfetti();
}

// --- Event Listeners ---
playAgain.addEventListener('click', ()=>{
    currentQuestion=0;
    endScreen.style.display='none';
    game.style.display='flex';
    showQuestion();
});

// --- Start Game ---
function startGame(){
    splash.style.display='flex';
    setTimeout(()=>{
        splash.style.display='none';
        game.style.display='flex';
        showQuestion();
    },2000);
}
startGame();
</script>
</body>
</html>
