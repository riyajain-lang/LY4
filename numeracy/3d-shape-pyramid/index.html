<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pyramid Shape Explorer</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Arial Rounded MT Bold",Arial,sans-serif;
    background:#fff7e6;
    user-select:none;
}

/* COMMON */

.screen{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}


/* ---------------- SPLASH ---------------- */

#splash{
    display:flex;
    background:white;
}

#splash img{
    width:180px;
    animation:logoPop 1s ease;
}

@keyframes logoPop{
    0%{
        transform:scale(.5);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}


/* ---------------- START ---------------- */

#startScreen{

    background:
    linear-gradient(
        180deg,
        #dff6ff,
        #fff1c7
    );

}


.background-shapes span{

    position:absolute;
    border-radius:50%;
    opacity:.25;
    animation:float 6s infinite ease-in-out;

}


.background-shapes span:nth-child(1){
    width:120px;
    height:120px;
    background:#60a5fa;
    top:10%;
    left:5%;
}

.background-shapes span:nth-child(2){
    width:90px;
    height:90px;
    background:#facc15;
    bottom:15%;
    right:10%;
    animation-delay:2s;
}

.background-shapes span:nth-child(3){
    width:70px;
    height:70px;
    background:#f472b6;
    top:30%;
    right:15%;
    animation-delay:1s;
}


@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-25px);
    }

}


.start-card{

    width:90%;
    max-width:600px;

    background:white;

    border-radius:35px;

    padding:25px;

    text-align:center;

    box-shadow:
    0 15px 30px rgba(0,0,0,.15);

    border:6px solid #fde68a;

    z-index:2;

}



.start-card h1{

    margin:5px;

    color:#ea580c;

    font-size:clamp(32px,7vw,55px);

}


.start-card p{

    font-size:clamp(24px,6vw,38px);

    color:#334155;

    font-weight:bold;

}


.mini-pyramid{

    width:150px;

    margin:10px auto;

    animation:bounce 2s infinite;

}


@keyframes bounce{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }

}


button{

    border:none;

    background:#22c55e;

    color:white;

    font-size:28px;

    font-weight:bold;

    padding:16px 45px;

    border-radius:50px;

    box-shadow:
    0 7px 0 #15803d;

}



button:active{

    transform:translateY(5px);

    box-shadow:
    0 2px 0 #15803d;

}



/* ---------------- GAME ---------------- */


#gameScreen{

    display:none;

    flex-direction:column;

    justify-content:flex-start;

    padding:10px;

    background:

    linear-gradient(
        180deg,
        #e0f2fe,
        #fff7ed
    );

}



.topbar{

    width:100%;

    max-width:1000px;

    display:flex;

    justify-content:space-between;

}


.badge{

    background:white;

    padding:8px 15px;

    border-radius:20px;

    font-size:18px;

    font-weight:bold;

    color:#475569;

    box-shadow:
    0 5px 12px rgba(0,0,0,.12);

}



.instruction{

    margin:8px;

    background:#ffffff;

    width:95%;

    max-width:900px;

    text-align:center;

    padding:12px;

    border-radius:25px;

    font-size:clamp(26px,6vw,42px);

    color:#7c2d12;

    box-shadow:
    0 8px 20px rgba(0,0,0,.12);

}



.options{

    width:100%;

    max-width:1000px;

    flex:1;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:15px;

    align-items:center;

}



.card{

    height:min(45vh,350px);

    background:white;

    border-radius:30px;

    border:5px solid #fde68a;

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:
    0 12px 22px rgba(0,0,0,.15);

    transition:.2s;

    position:relative;

}



.card img{

    max-width:85%;

    max-height:85%;

}


.card:active{

    transform:scale(.94);

}


.wiggle{

animation:shake .35s;

}


@keyframes shake{

0%{transform:translateX(0)}
25%{transform:translateX(-12px)}
50%{transform:translateX(12px)}
75%{transform:translateX(-8px)}
100%{transform:translateX(0)}

}



.glow{

    animation:magicGlow 1s infinite alternate;

}



@keyframes magicGlow{

from{

box-shadow:
0 0 10px #22c55e;

}

to{

box-shadow:
0 0 35px #22c55e;

}

}



.feedback{

position:absolute;

inset:0;

background:rgba(255,255,255,.9);

border-radius:25px;

display:none;

align-items:center;

justify-content:center;

flex-direction:column;

}


.tick{

width:90px;

height:90px;

background:#22c55e;

color:white;

border-radius:50%;

font-size:65px;

display:flex;

align-items:center;

justify-content:center;

animation:pop .5s;

}


@keyframes pop{

from{
transform:scale(0);
}

to{
transform:scale(1);
}

}


.good{

font-size:35px;

color:#15803d;

font-weight:bold;

}


/* MOBILE */

@media(max-width:700px){

.options{

grid-template-columns:1fr;

gap:8px;

}


.card{

height:28vh;

}


.instruction{

font-size:25px;

}

}
<!-- END SCREEN -->

<div id="endScreen" class="screen">

<canvas id="confetti"></canvas>

<div class="start-card">

<h1 style="color:#16a34a;">
🎉 Amazing!
</h1>

<img class="mini-pyramid" src="assets/pyramid1.png">

<p>
You are a Pyramid Explorer!
</p>

<button onclick="restartGame()">
Play Again
</button>

</div>

</div>



<audio id="correctSound" src="assets/claps.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>



<script>


/* ---------------- VARIABLES ---------------- */


let currentQuestion=0;

let wrongAttempts=0;

let locked=false;


let questions=[];


const totalQuestions=6;



const splash=document.getElementById("splash");

const startScreen=document.getElementById("startScreen");

const gameScreen=document.getElementById("gameScreen");

const endScreen=document.getElementById("endScreen");


const optionsBox=document.getElementById("options");



const questionNumber=document.getElementById("questionNumber");

const attempt=document.getElementById("attempt");



const correctSound=document.getElementById("correctSound");

const wrongSound=document.getElementById("wrongSound");



/* ---------------- LOGO TIMER ---------------- */


window.onload=function(){

setTimeout(()=>{

splash.style.display="none";

startScreen.style.display="flex";

},2000);


};




/* ---------------- START ---------------- */


function startGame(){


startScreen.style.display="none";

endScreen.style.display="none";

gameScreen.style.display="flex";


createQuestions();


currentQuestion=0;


loadQuestion();


}






/* ---------------- QUESTIONS ---------------- */


function createQuestions(){


questions=[];


for(let i=1;i<=6;i++){


questions.push({

options:[

{
type:"cube",
img:`assets/cube${i}.png`
},

{
type:"pyramid",
img:`assets/pyramid${i}.png`
},


{
type:"sphere",
img:`assets/sphere${i}.png`
}


]


});


}



shuffle(questions);



}






/* ---------------- LOAD QUESTION ---------------- */


function loadQuestion(){


locked=false;

wrongAttempts=0;


questionNumber.innerHTML=

`${currentQuestion+1} / 6`;


attempt.innerHTML="Try 1";


optionsBox.innerHTML="";



let options=[...questions[currentQuestion].options];


shuffle(options);



options.forEach(item=>{


let card=document.createElement("div");


card.className="card";


card.dataset.type=item.type;



let img=document.createElement("img");


img.src=item.img;



let feedback=document.createElement("div");


feedback.className="feedback";


feedback.innerHTML=

`
<div class="tick">✓</div>

<div class="good">
Good Job!
</div>
`;



card.appendChild(img);

card.appendChild(feedback);



card.onclick=function(){

checkAnswer(card);

};



optionsBox.appendChild(card);



});


}







/* ---------------- ANSWER CHECK ---------------- */



function checkAnswer(card){


if(locked)return;



if(card.dataset.type==="pyramid"){


correct(card);



}

else{


wrong(card);


}



}






function wrong(card){


wrongAttempts++;


wrongSound.currentTime=0;

wrongSound.play().catch(()=>{});



card.classList.add("wiggle");



setTimeout(()=>{

card.classList.remove("wiggle");

},400);



if(wrongAttempts===1){


attempt.innerHTML="Try 2";


}



if(wrongAttempts>=2){


showHint();


}


}







function showHint(){


document.querySelectorAll(".card")

.forEach(card=>{


if(card.dataset.type==="pyramid"){


card.classList.add("glow");


}



});


}








function correct(card){


locked=true;



correctSound.currentTime=0;

correctSound.play().catch(()=>{});



card.querySelector(".feedback")

.style.display="flex";



document.querySelectorAll(".card")

.forEach(c=>{

c.style.pointerEvents="none";

});



setTimeout(()=>{


currentQuestion++;


if(currentQuestion<totalQuestions){


loadQuestion();


}

else{


finishGame();


}



},1200);



}







/* ---------------- END ---------------- */



function finishGame(){


gameScreen.style.display="none";


endScreen.style.display="flex";


startConfetti();



}




function restartGame(){


stopConfetti();


endScreen.style.display="none";


startGame();



}





/* ---------------- SHUFFLE ---------------- */


function shuffle(array){


for(let i=array.length-1;i>0;i--){


let j=Math.floor(Math.random()*(i+1));


[array[i],array[j]]

=

[array[j],array[i]];


}


}





/* ---------------- CONFETTI ---------------- */


let canvas=document.getElementById("confetti");

let ctx=canvas.getContext("2d");


let pieces=[];

let animation;



function resize(){


canvas.width=window.innerWidth;

canvas.height=window.innerHeight;


}


window.onresize=resize;



function startConfetti(){


resize();


pieces=[];


for(let i=0;i<120;i++){


pieces.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

size:Math.random()*8+4,

speed:Math.random()*3+2,

rotate:Math.random()*360,

color:

[
"#f97316",
"#22c55e",
"#3b82f6",
"#e879f9",
"#facc15"

][Math.floor(Math.random()*5)]

});


}


animate();



}



function animate(){


ctx.clearRect(0,0,canvas.width,canvas.height);



pieces.forEach(p=>{


p.y+=p.speed;


p.rotate+=5;



if(p.y>canvas.height){

p.y=-10;

}



ctx.save();


ctx.translate(p.x,p.y);


ctx.rotate(p.rotate);


ctx.fillStyle=p.color;


ctx.fillRect(
0,
0,
p.size,
p.size
);


ctx.restore();



});



animation=requestAnimationFrame(animate);



}





function stopConfetti(){


cancelAnimationFrame(animation);


ctx.clearRect(

0,
0,
canvas.width,
canvas.height

);


}



</script>


</body>

</html>
