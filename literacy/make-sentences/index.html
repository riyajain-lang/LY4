<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mad Sentences - LY4</title>
<style>
body, html {
  margin: 0; padding: 0; font-family: 'Arial', sans-serif;
  height: 100%; width: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center;
  background-color: #4CAF50;
}
#logoScreen, #gameScreen, #endScreen { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; position: absolute; top: 0; left:0;}
#logoScreen { background: #fff; z-index:2;}
#logoScreen img { width: 200px; }
#gameScreen { background: #4CAF50; z-index:1; display:none;}
#creamBox { background: #fffdd0; border-radius: 12px; width: 90%; max-width: 400px; padding: 10px; box-shadow: 0 0 10px #00000033; }
#instruction { text-align:center; font-size:16px; margin-bottom:5px; color:#333; }
#lineContainer { margin-bottom: 10px; }
.line { display:flex; align-items:center; justify-content:flex-start; height: 35px; margin:3px 0; border-bottom:1px solid #ccc; font-size:18px; padding-left:5px; cursor:pointer; }
.lineThumb { width:30px; height:30px; margin-left:5px; display:none; border-radius:4px; }
#imageContainer { width: 100%; text-align:center; margin-bottom:10px; }
#imageContainer img { max-width: 100%; border-radius:8px; }
.wordBank { display:flex; flex-wrap: wrap; justify-content: center; margin-top:10px; }
.word { background:#4CAF50; color:white; padding:5px 10px; margin:3px; border-radius:5px; cursor:pointer; user-select:none; font-size:16px; }
.word.used { background:#9E9E9E; cursor:default; }
#feedback { margin-top:5px; font-size:18px; height:24px; }
#score { margin-top:5px; }
#nextBtn { margin-top:10px; padding:5px 15px; background:#2196F3; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; display:none;}
#endScreen { background:#4CAF50; color:white; font-size:24px; display:none; flex-direction:column; justify-content:center; align-items:center;}
</style>
</head>
<body>

<!-- Slide 1: Logo -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Slide 2+: Game Screen -->
<div id="gameScreen">
  <div id="creamBox">
    <div id="instruction">Tap on a word below and place it in the line to form a sentence</div>
    <div id="imageContainer"><img id="mainImage" src="" alt=""></div>
    <div id="linesContainer">
      <div class="line" data-index="0"><img class="lineThumb" src="" alt=""></div>
      <div class="line" data-index="1"><img class="lineThumb" src="" alt=""></div>
      <div class="line" data-index="2"><img class="lineThumb" src="" alt=""></div>
      <div class="line" data-index="3"><img class="lineThumb" src="" alt=""></div>
    </div>
    <div class="wordBank" id="wordBank"></div>
    <div id="feedback"></div>
    <div id="score"></div>
    <button id="nextBtn">Next</button>
  </div>
</div>

<!-- End Screen -->
<div id="endScreen">
  🎉 Well Done! 🎉
  <button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions = [
  {img:'assets/car.png', sentence:['The','car','is','fast'], words:['car','fast','is','The']},
  {img:'assets/school.png', sentence:['I','go','to','school'], words:['to','school','I','go']},
  {img:'assets/mountains.png', sentence:['Mountains','are','high','today'], words:['today','Mountains','high','are']},
  {img:'assets/tree.png', sentence:['The','tree','has','leaves'], words:['has','leaves','The','tree']},
  {img:'assets/butterfly.png', sentence:['The','butterfly','is','colorful'], words:['colorful','is','The','butterfly']},
  {img:'assets/dance.png', sentence:['She','likes','to','dance'], words:['dance','likes','She','to']}
];

let currentQ = 0;
let userAnswer = [[],[],[],[]];
let score = 0;

function showQuestion(){
  const q = questions[currentQ];
  document.getElementById('mainImage').src = q.img;
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  
  const lines = document.querySelectorAll('.line');
  lines.forEach(l=>{ l.textContent=''; l.querySelector('.lineThumb').style.display='none'; });
  
  const bank = document.getElementById('wordBank');
  bank.innerHTML='';
  shuffle([...q.words]).forEach(w=>{
    const btn = document.createElement('div');
    btn.textContent=w; btn.className='word';
    btn.onclick = ()=>{ selectWord(w,btn); };
    bank.appendChild(btn);
  });
}

function selectWord(word, btn){
  const lines = document.querySelectorAll('.line');
  let placed = false;
  for(let i=0;i<lines.length;i++){
    if(lines[i].textContent===''){
      lines[i].textContent=word;
      userAnswer[i].push(word);
      
      // show thumbnail for this question
      const thumb = lines[i].querySelector('.lineThumb');
      thumb.src = questions[currentQ].img; 
      thumb.style.display = 'inline-block';
      
      btn.classList.add('used');
      placed=true; break;
    }
  }
  if(placed && userAnswer.flat().length===questions[currentQ].sentence.length){
    checkAnswer();
  }
}

function checkAnswer(){
  const q = questions[currentQ];
  let correct=true;
  for(let i=0;i<q.sentence.length;i++){
    if(userAnswer[i][0]!==q.sentence[i]){ correct=false; break; }
  }
  if(correct){
    document.getElementById('feedback').textContent='✅ Good Job!';
    document.getElementById('correctSound').play();
    score++;
  }else{
    document.getElementById('feedback').textContent='❌ Try Again';
    document.getElementById('wrongSound').play();
  }
  document.getElementById('score').textContent='Score: '+score+' / '+questions.length;
  document.getElementById('nextBtn').style.display='inline-block';
}

document.getElementById('nextBtn').onclick = ()=>{
  currentQ++;
  userAnswer=[[],[],[],[]];
  if(currentQ<questions.length){ showQuestion(); }
  else{
    document.getElementById('gameScreen').style.display='none';
    document.getElementById('endScreen').style.display='flex';
    document.getElementById('clapSound').play();
  }
};

function restartGame(){
  currentQ=0; score=0; userAnswer=[[],[],[],[]];
  document.getElementById('endScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  showQuestion();
}

function shuffle(array){
  for (let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Logo screen timeout
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  showQuestion();
},2000);

</script>
</body>
</html>
